<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>autoraffkat</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon.png">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="alternate icon" href="/static/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="header-top">
    <div class="titles">
      <h1 id="project-name">—</h1>
      <p id="project-meta" class="muted"></p>
    </div>
    <div class="header-utilities">
      <a href="/trailer" class="ghost" data-t="trailer.nav">Trailer</a>
      <span id="language" class="langs"></span>
      <button id="shortcuts" type="button" class="ghost keys-open" aria-haspopup="dialog">Pikanäppäimet <kbd>?</kbd></button>
    </div>
  </div>
  <div class="toolbar">
    <div id="document-controls" class="toolbar-group" role="group">
      <button id="open-media" class="ghost">Tuo media…</button>
      <button id="open" class="ghost">Avaa XML…</button>
      <button id="reload" class="ghost">Lue uudestaan</button>
      <button id="relink" class="ghost hidden">Etsi tiedostot…</button>
    </div>
    <div id="history-controls" class="toolbar-group" role="group">
      <button id="history-undo" class="ghost" data-t="history.undo">Kumoa</button>
      <button id="history-redo" class="ghost" data-t="history.redo">Tee uudelleen</button>
      <select id="history-branches" aria-label="Muokkaushaarat"></select>
    </div>
    <div id="output-controls" class="toolbar-group" role="group">
      <span id="mix-host"></span>
      <span class="render-controls">
        <button id="render" class="ghost">Renderöi video</button>
        <button id="render-stop" class="ghost hidden">Pysäytä</button>
      </span>
      <span id="export-dest" class="export-dest" role="radiogroup"></span>
      <button id="export" class="primary">Vie XML</button>
    </div>
  </div>
</header>

<div id="status" class="status-line muted" role="status" aria-live="polite"></div>
<div id="banner" class="banner hidden" role="alert"></div>
<div id="exported" class="exported hidden" role="status" aria-live="polite"></div>
<section id="media-sync" class="panel sync-panel hidden" aria-labelledby="media-sync-title">
  <div class="sync-head">
    <div>
      <h2 id="media-sync-title" data-t="sync.title">Tuo kamera- ja mikrofonitiedostot</h2>
      <p class="muted" data-t="sync.help">Valitse kameran ääni vertailuksi. Tarkista arvioidut siirrot ennen aikajanan luontia.</p>
    </div>
    <button id="media-sync-close" type="button" class="ghost" data-t="sync.close">Sulje</button>
  </div>
  <label class="field"><span data-t="sync.reference">Synkan vertailukamera</span><select id="media-sync-reference"></select></label>
  <label class="field"><span data-t="sync.window">Hakuikkuna</span><select id="media-sync-window">
    <option value="auto" data-t="sync.windowAuto" selected>Automaattinen</option>
    <option value="300" data-t="sync.window5min">±5 min</option>
    <option value="1800" data-t="sync.window30min">±30 min</option>
    <option value="7200" data-t="sync.window2h">±2 h</option>
    <option value="full" data-t="sync.windowFull">Koko aineisto</option>
  </select></label>
  <div id="media-sync-sources" class="sync-sources"></div>
  <p id="media-sync-progress" class="muted" role="status" aria-live="polite"></p>
  <div id="media-sync-preview-box" class="hidden">
    <video id="media-sync-preview" controls preload="metadata"></video>
  </div>
  <div class="sync-actions">
    <button id="media-sync-estimate" type="button" class="ghost" data-t="sync.estimate">Arvioi synkka</button>
    <button id="media-sync-listen" type="button" class="ghost" data-t="sync.listenAll">Kuuntele yhteinen kohta</button>
    <button id="media-sync-import" type="button" class="primary" data-t="sync.import">Käytä siirtoja ja jatka</button>
  </div>
</section>

<main>
  <section class="panel tracks">
    <h2 data-t="app.tracks">Raidat</h2>
    <div id="patch" class="patch"></div>
  </section>

  <!-- Kaksi paneelia yhdessä kiskossa: leveällä ruudulla kisko jakautuu
       kahdeksi sarakkeeksi, jolloin ääni ei jää kuvan alle piiloon, ja
       kapealla ne latautuvat päällekkäin kuten ennenkin. -->
  <div class="rail">
    <section class="panel globals">
      <h2 data-t="app.globals">Leikkaus</h2>

      <h3 data-t="rhythm.title">Rytmi ja profiili</h3>
      <div id="rhythm-rules" class="rules"></div>
      <div id="global-list"></div>

      <div id="cut-rows"></div>
    </section>

    <section class="panel audio">
      <h2 data-t="app.audio">Ääni</h2>
      <div id="audio-panel"></div>
      <datalist id="plugin-names"></datalist>

      <h3 data-t="app.project">Projekti</h3>
      <label class="field">
        <span data-t="app.name">Nimi</span>
        <input id="project-title" type="text" autocomplete="off">
      </label>
      <div id="name-tags"></div>
      <p class="muted small" id="paths"></p>
    </section>

    <section class="panel package">
      <h2 data-t="package.title">Paketti</h2>
      <div id="package-panel"></div>
    </section>
  </div>
</main>

<section class="panel preview">
  <div class="preview-head">
    <h2 id="preview-title" data-t="app.preview">Esikatselu</h2>
    <span id="zoom-note" class="zoomed hidden"></span>
    <span id="counts" class="muted"></span>
  </div>
  <div class="range-controls" role="group" aria-labelledby="preview-title">
    <button id="mark-in" type="button" class="ghost" data-t="range.markIn">Merkitse alku</button>
    <button id="mark-out" type="button" class="ghost" data-t="range.markOut">Merkitse loppu</button>
    <label class="range-number"><span data-t="range.in">Alku (s)</span><input id="range-in" type="number" step="0.04"></label>
    <label class="range-number"><span data-t="range.out">Loppu (s)</span><input id="range-out" type="number" step="0.04"></label>
    <button id="range-clear" type="button" class="ghost" data-t="range.clear">Tyhjennä rajaus</button>
    <span class="muted small" data-t="range.instruction">Valitse alku tai loppu ja napsauta aikajanaa.</span>
  </div>
  <div class="timeline-wrap">
    <canvas id="bar" height="120"></canvas>
    <div id="range-overlay" class="range-overlay hidden" aria-hidden="true">
      <div id="range-shade" class="range-shade"></div>
      <i id="range-in-handle" class="range-handle"></i>
      <i id="range-out-handle" class="range-handle"></i>
    </div>
  </div>
  <div id="ruler" class="ruler"></div>
  <div id="legend" class="legend"></div>
</section>

<section class="panel cuts">
  <div class="preview-head">
    <h2 data-t="app.cuts">Leikkauslista</h2>
    <span id="cut-summary" class="muted"></span>
  </div>
  <div class="table-wrap">
    <table id="cut-table">
      <thead><tr><th data-t="table.index">#</th><th data-t="table.start">Alku</th><th data-t="table.end">Loppu</th><th data-t="table.duration">Kesto</th><th data-t="table.shot">Kuva</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</section>

<!-- Pikanäppäimet: app.js piirtää sisällön SHORTCUTS-luettelosta. -->
<dialog id="shortcut-sheet" class="sheet" aria-labelledby="shortcut-title"></dialog>

<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
