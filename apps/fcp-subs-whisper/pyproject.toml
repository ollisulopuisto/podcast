[project]
name = "fcp-subs-whisper"
version = "2026.9.17.1"
description = "High-performance subtitle generator for Final Cut Pro (FCP) using Whisper"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Olli Sulopuisto" }]
keywords = ["fcpx", "final-cut-pro", "subtitles", "captions", "whisper", "mlx", "diarization"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
]
dependencies = [
    "faster-whisper>=1.2.1",
    "mlx-whisper>=0.4.3",
    "tqdm>=4.70.1",
    "wyoming>=1.8.0",
    "pyannote.audio>=3.3.1",
    "torch>=2.5.1",
]

[project.optional-dependencies]
orukeet = [
    "orukeet @ https://github.com/Oruk-AI/orukeet/releases/download/v0.1.1/orukeet-0.1.1-py3-none-any.whl",
]
ultra = ["moondream>=2.6.1"]

[project.scripts]
fcp-subs-whisper = "fcp_subs_whisper.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/fcp_subs_whisper"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

