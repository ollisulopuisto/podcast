[project]
name = "automixer"
version = "2026.4.5.37"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mlx>=0.30.6",
    "numpy>=2.4.2",
    "pedalboard>=0.9.22",
    "psutil>=7.2.2",
    "pyloudnorm>=0.2.0",
    "pytest>=9.0.2",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
    "textual>=8.0.0",
]

[project.scripts]
automixer = "automixer.cli_mix:main"
autoanalyze = "automixer.cli_analyze:main"
autotui = "automixer.app:main"

# The importable package is `automixer`, living under src/.  Spelling the build
# out rather than relying on setuptools' auto-discovery keeps the installed
# name identical whether this is installed on its own or as a member of the
# podcast workspace -- the ambiguity is what let `src.automixer` survive: it
# resolves as a namespace package whenever the repository root happens to be on
# sys.path, and only fails once the package is really installed.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/automixer"]

[tool.pytest.ini_options]
# The tests import `automixer`, the installed package -- not a path relative to
# the checkout.  Run them with `uv run pytest`, which installs the project into
# the environment first.
testpaths = ["tests"]
# Kuten apps/autoraffkat: testit löytävät paketin myös synkkaamattomasta
# työpuusta, eikä asennuksen tila muutu siitä.
pythonpath = ["src"]
