[project]
name = "automixer"
version = "2026.4.5.37"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mlx>=0.30.6",
    "numpy>=2.4.2",
    "pedalboard>=0.9.22",
    "psutil>=7.2.2",
    "pyloudnorm>=0.2.0",
    "pytest>=9.0.2",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
    "textual>=8.0.0",
]

[project.scripts]
automixer = "automixer.cli_mix:main"
autoanalyze = "automixer.cli_analyze:main"
autotui = "automixer.app:main"

# The importable package is `automixer`, under src/.  Spelled out rather than
# left to setuptools' auto-discovery so the installed name is the same however
# it is installed -- that ambiguity is what let `src.automixer` survive: it
# resolves as a namespace package whenever the checkout root happens to be on
# sys.path, and fails the moment the package is really installed, which a
# workspace member is by definition.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/automixer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
