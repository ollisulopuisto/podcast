<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podcast Magic</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="shell">

  <!-- Kuori vasemmalla: istunto ja työkalut ovat samat välilehdestä
       riippumatta, joten ne eivät kuulu sisältöön eivätkä vie sen leveyttä. -->
  <aside class="rail">
    <div class="titles">
      <h1>Podcast Magic</h1>
      <p class="muted small" id="version"></p>
    </div>

    <section class="source">
      <h2 id="session-title" data-t="app.session">Istunto</h2>
      <input id="session" type="text" spellcheck="false" autocomplete="off"
             aria-labelledby="session-title" placeholder="…/jakso.nhsx">
      <p id="session-note" class="muted small"></p>
      <button id="browse" class="ghost" data-t="app.change">Vaihda…</button>
    </section>

    <h2 id="tools-title" data-t="app.tools">Työkalut</h2>
    <nav id="tabs" class="tabs" role="tablist" aria-labelledby="tools-title"></nav>

    <div id="browser" class="browser hidden"></div>

    <div class="rail-foot">
      <span id="language" class="langs"></span>
      <button id="shortcuts" class="ghost" data-t="app.shortcuts" aria-haspopup="dialog">Näppäinoikotiet</button>
    </div>
  </aside>

  <div class="work">
    <div id="banner" class="banner hidden" role="alert"></div>
    <main id="panels" role="tabpanel"></main>

    <!-- Työn kulku alapalkkina: se on paikallaan myös ennen ajoa, joten
         mikään ei hyppää kun ajo alkaa. -->
    <section class="jobbar hidden" id="job">
      <div class="job-head">
        <span id="job-step"></span>
        <span id="job-file" class="muted"></span>
        <span id="job-all" class="muted"></span>
        <button id="job-log-toggle" class="ghost" data-t="app.log">Loki</button>
        <button id="cancel" class="ghost" data-t="app.cancel">Keskeytä</button>
      </div>
      <div class="progress"><div id="job-fill" class="progress-fill"></div></div>
      <pre id="job-log" class="log hidden"></pre>
      <div id="job-result" class="exported hidden"></div>
    </section>
  </div>

</div>

<dialog id="shortcuts-dialog" aria-labelledby="shortcuts-title">
  <h2 id="shortcuts-title" data-t="app.shortcuts">Näppäinoikotiet</h2>
  <div id="shortcuts-list"></div>
  <p class="muted small" data-t="app.shortcutsHint">Tekstikenttien omat näppäimet säilyvät. Sulje painamalla Esc.</p>
  <form method="dialog"><button data-t="app.close">Sulje</button></form>
</dialog>
<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
<script src="/static/mod_chain.js"></script>
<script src="/static/mod_transcribe.js"></script>
<script src="/static/mod_silence.js"></script>
<script src="/static/mod_script.js"></script>
<script src="/static/mod_merge.js"></script>
<script>PM.start();</script>
</body>
</html>
