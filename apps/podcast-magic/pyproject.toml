[project]
name = "podcast-magic"
version = "2026.9.2.1"
description = "Hindenburg-jälkityöt macOS:llä: litterointi ja hiljaisten kohtien vaimennus"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Olli Sulopuisto" }]
keywords = ["hindenburg", "whisper", "mlx", "transcription", "podcast", "nhsx"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
]
dependencies = [
    # Jaettu puheenkäsittely työtilasta, ei julkaisusta: sääntö siitä milloin
    # mikki on äänessä on yksi ja se asuu siellä. Ks. CLAUDE.md.
    "speechmix",
    "numpy>=2.4.2",
    "lxml>=5.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pywebview>=5.0",
]

[project.scripts]
podcast-magic = "podcastmagic.__main__:main"
# Istunto WAViksi ilman Hindenburgia ja ilman tätä sovellusta: pelkkä
# `nhsx/`, numpy ja ffmpeg. Oma komentonsa eikä `podcast-magic`in valitsin,
# koska sen koko pointti on olla se joka toimii kun muuta ei ole.
nhsx-render = "podcastmagic.nhsx.cli:main"
json-to-text = "podcastmagic.transcribe.json_to_text:main"

[project.optional-dependencies]
# Apple Silicon: Metal-kiihdytetty Whisper. Ei asennu Intelille eikä Linuxille,
# joten se on erillinen lisä eikä perusriippuvuus — muuten `uv sync` kaatuisi
# CI-ajurilla ja Intel-Macilla ennen kuin ohjelma edes käynnistyy.
mlx = ["mlx-whisper>=0.4.0"]
# Kaikille alustoille sopiva varakone. Sama moottori kuin Colab-muistikirjassa.
faster = ["faster-whisper>=1.1.0"]

[tool.uv.sources]
speechmix = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/podcastmagic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyinstaller>=6.0",
]
