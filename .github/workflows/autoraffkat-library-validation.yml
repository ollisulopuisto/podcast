name: autoraffkat library validation

# Todistaa hardened runtimen kirjastovalidoinnin: Developer ID -allekirjoitettu
# isäntä, jolla on sovelluksen oikeudet, ei saa ladata toisen tiimin (tässä
# ad hoc) allekirjoittamaa kirjastoa ilman disable-library-validation-oikeutta.
# Käyttäjän VST3/AU-liitännäiset ovat muiden tiimien allekirjoittamia.
on:
  pull_request:
    paths:
      - apps/autoraffkat/autoraffkat.entitlements
      - .github/workflows/autoraffkat-library-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  library-validation:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BUILD_CERTIFICATE_BASE64"
          KEYCHAIN_PATH="$RUNNER_TEMP/podcast-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 -D -o "$CERTIFICATE_PATH"
          export KEYCHAIN_PATH="$KEYCHAIN_PATH" CERTIFICATE_PATH="$CERTIFICATE_PATH"
          export KEYCHAIN_PASSWORD="$KEYCHAIN_PASSWORD" P12_PASSWORD="$P12_PASSWORD"
          python3 "$GITHUB_WORKSPACE/scripts/macos_ci_credentials.py" import-certificate
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"

      - name: Host with the shipped entitlements loads a third-party-signed plug-in
        env:
          ID: "Developer ID Application: Olli Sulopuisto (LWSR8T5392)"
        run: |
          set -euo pipefail
          mkdir t && cd t
          cat > host.c <<'C'
          #include <dlfcn.h>
          #include <stdio.h>
          int main(int argc, char **argv) {
            void *h = dlopen(argv[1], RTLD_NOW);
            if (!h) { printf("dlopen failed: %s\n", dlerror()); return 1; }
            puts("loaded");
            return 0;
          }
          C
          echo 'int plugin_marker(void) { return 42; }' > plug.c
          # Muun tiimin (ei meidän, ei Applen) allekirjoittama VST3-rakenteinen paketti.
          mkdir -p Fake.vst3/Contents/MacOS
          clang -dynamiclib -o Fake.vst3/Contents/MacOS/Fake plug.c
          codesign --force --sign - Fake.vst3
          clang -o host host.c

          # Pohja: hardened runtime ilman oikeuksia. Kirjastovalidointi estää latauksen.
          cp host host_plain
          codesign --force --options runtime --sign "$ID" host_plain
          set +e; ./host_plain Fake.vst3/Contents/MacOS/Fake; base=$?; set -e
          echo "baseline (no entitlements) exit=$base"

          # Sovelluksen oikeudet sellaisinaan, kuten ne toimitetaan.
          cp host host_app
          codesign --force --options runtime --entitlements "$GITHUB_WORKSPACE/apps/autoraffkat/autoraffkat.entitlements" --sign "$ID" host_app
          codesign -d --entitlements :- host_app 2>/dev/null | grep -o 'com.apple.security.cs.[a-z-]*' || true
          set +e; ./host_app Fake.vst3/Contents/MacOS/Fake; app=$?; set -e
          echo "shipped entitlements exit=$app"

          if [ "$base" -eq 0 ]; then
            echo "::warning::runner does not enforce library validation (baseline loaded); result proves nothing"
          fi
          test "$app" -eq 0 || { echo "::error::shipped entitlements cannot load a third-party-signed plug-in"; exit 1; }

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/podcast-signing.keychain-db" || true
