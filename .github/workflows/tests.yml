name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS, koska ohjelma on macOS-ohjelma. Ajuri on Apple Siliconia, joten
    # myös mlx asentuu — ilman sitä nopein moottori jäisi kokonaan ajamatta
    # CI:ssä ja rikkoutuisi huomaamatta.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: brew install ffmpeg

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Node tarvitaan käyttöliittymän savutestiin. Ilman sitä se ohittuu
      # hiljaa, ja juuri se testi suojaa siltä virheluokalta jota Python ei näe.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: uv sync --extra mlx --extra faster

      - name: Tests
        run: uv run pytest -q

      - name: Check that the interface smoke test actually ran
        run: |
          uv run pytest tests/test_ui.py -q --no-header -rs | tee /tmp/ui.log
          if grep -q "skipped" /tmp/ui.log; then
            echo "Käyttöliittymän savutesti ohittui — node puuttuu ajurilta."
            exit 1
          fi

      - name: Check that both engines are importable on this runner
        run: |
          uv run python -c "
          from podcastmagic.transcribe.backends import infos
          for info in infos():
              print(info.key, info.available, info.reason)
              assert info.available, info.reason
          "
