name: tests

# macOS, koska ffmpegin lisäksi testataan Finderin valintaa ja Visionia.
#
# Push vain mainiin: haara jolla on PR ajoi ennen samat testit kahdesti
# (push ja pull_request), ja macOS-minuutti on kymmenen Linux-minuutin hinta.
# Haara ilman PR:ää ei saa ajoa; `workflow_dispatch` on sitä varten.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Uusi commit samaan haaraan mitätöi edellisen ajon. Mainilla ajoa ei
# peruta: jokaisen mainiin menneen commitin tulos halutaan nähdä.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Explicit bash enables pipefail for pytest output piped through tee.
defaults:
  run:
    shell: bash

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.suites.outputs.macos }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: suites
        name: Select affected test suites
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] || [ "$EVENT_NAME" = push ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            python scripts/ci_test_selection.py --all </dev/null
          elif [ "$EVENT_NAME" = pull_request ]; then
            git diff --name-only "$BASE_SHA...HEAD" | python scripts/ci_test_selection.py --base "$(git merge-base "$BASE_SHA" HEAD)"
          else
            git diff --name-only "$BEFORE_SHA" HEAD | python scripts/ci_test_selection.py --base "$BEFORE_SHA"
          fi

  speechmix:
    needs: [select]
    if: ${{ contains(fromJSON(needs.select.outputs.macos), 'all') || contains(fromJSON(needs.select.outputs.macos), 'speechmix') }}
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      UV_NO_SYNC: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: brew install ffmpeg portaudio
      - run: uv sync --locked --only-group dev
      - run: uv sync --locked --inexact --package speechmix --package autoraffkat --package automixer --group dev
      # speechmix fixtures import autoraffkat.model/audio; Metal is optional
      # in speechmix but supplied by automixer for the memory/peak path.
      - name: speechmix
        run: uv run --directory packages/speechmix pytest -q

  autoraffkat:
    needs: [select]
    if: ${{ contains(fromJSON(needs.select.outputs.macos), 'all') || contains(fromJSON(needs.select.outputs.macos), 'autoraffkat') }}
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      UV_NO_SYNC: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: brew install ffmpeg portaudio
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: uv sync --locked --only-group dev
      - run: uv sync --locked --inexact --package autoraffkat --package nhsx --group dev
      - name: autoraffkat
        run: uv run --directory apps/autoraffkat pytest -q --ignore=tests/test_ui.py --ignore=tests/test_shortcuts.py
      - name: autoraffkat — interface tests ran
        run: |
          uv run --directory apps/autoraffkat \
            pytest tests/test_ui.py tests/test_shortcuts.py -q --no-header -rs | tee /tmp/araf-ui.log
          if grep -q "skipped" /tmp/araf-ui.log; then
            echo "An autoraffkat interface test was skipped: node is missing on the runner."
            exit 1
          fi
          grep -q " passed" /tmp/araf-ui.log

  automixer:
    needs: [select]
    if: ${{ contains(fromJSON(needs.select.outputs.macos), 'all') || contains(fromJSON(needs.select.outputs.macos), 'automixer') }}
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      UV_NO_SYNC: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: brew install ffmpeg portaudio
      - run: uv sync --locked --only-group dev
      - run: uv sync --locked --inexact --package automixer --group dev
      - name: automixer
        run: uv run --directory apps/automixer pytest -q -m "not mlx"
      - name: Upload Automixer native GUI smoke screenshot
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: automixer-native-smoke
          path: /tmp/automixer-smoke.png
          if-no-files-found: warn
          retention-days: 3
      - name: automixer — the mlx tests ran
        run: |
          uv run --directory apps/automixer pytest -m mlx -q --no-header -rs | tee /tmp/mlx.log
          if grep -q "skipped" /tmp/mlx.log; then
            echo "A test marked mlx was skipped on macOS."
            exit 1
          fi
          grep -q " passed" /tmp/mlx.log

  podcast-magic:
    needs: [select]
    if: ${{ contains(fromJSON(needs.select.outputs.macos), 'all') || contains(fromJSON(needs.select.outputs.macos), 'podcast-magic') }}
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      UV_NO_SYNC: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: brew install ffmpeg portaudio
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: uv sync --locked --only-group dev
      - run: uv sync --locked --inexact --package podcast-magic --extra mlx --extra faster --group dev
      - name: podcast-magic
        run: uv run --directory apps/podcast-magic pytest -q --ignore=tests/test_ui.py --ignore=tests/test_render_endtoend.py
      - name: podcast-magic — savutesti myös ajettiin
        run: |
          uv run --directory apps/podcast-magic \
            pytest tests/test_ui.py -q --no-header -rs | tee /tmp/ui.log
          if grep -q "skipped" /tmp/ui.log; then
            echo "Käyttöliittymän savutesti ohittui — node puuttuu ajurilta."
            exit 1
          fi
      - name: podcast-magic — renderöinti ajettiin oikealla ffmpegillä
        run: |
          uv run --directory apps/podcast-magic \
            pytest tests/test_render_endtoend.py -q --no-header -rs | tee /tmp/e2e.log
          if grep -q "skipped" /tmp/e2e.log; then
            echo "Renderöinnin päästä päähän -testi ohittui — ffmpeg puuttuu ajurilta."
            exit 1
          fi
      - name: podcast-magic — molemmat moottorit tuotavissa
        run: |
          uv run --directory apps/podcast-magic python -c "
          from podcastmagic.transcribe.backends import resolve
          backend = resolve('auto')
          info = backend.info()
          print(info.key, info.available, info.reason)
          assert info.available, info.reason
          "

  test:
    name: test
    if: ${{ always() }}
    needs: [select, speechmix, autoraffkat, automixer, podcast-magic]
    runs-on: ubuntu-latest
    steps:
      - name: All selected Mac suites passed
        env:
          SELECTION: ${{ needs.select.outputs.macos }}
          RESULTS: ${{ toJSON(needs) }}
          SELECT_OK: ${{ needs.select.result == 'success' }}
        run: |
          python - <<'PY'
          import json, os
          assert os.environ["SELECT_OK"] == "true", "selector failed or was cancelled"
          selected = json.loads(os.environ["SELECTION"])
          results = json.loads(os.environ["RESULTS"])
          for name in ("speechmix", "autoraffkat", "automixer", "podcast-magic"):
              result = results[name]["result"]
              assert result not in ("failure", "cancelled"), (name, result)
              expected = "all" in selected or name in selected
              assert result == ("success" if expected else "skipped"), (name, result, expected)
          PY
