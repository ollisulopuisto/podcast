name: build viewer

# Yksi julkaisu, kaksi tuotetta, sama tarina: lue `.nhsx` ilman Hindenburgia.
#
#   NHSX Viewer.app   Finderin välilyönti näyttää istunnon ja soittaa sen
#   nhsx-render           yksi binääri, joka kirjoittaa istunnosta WAVin
#
# Ne julkaistaan yhdessä, koska käyttäjälle ne ovat sama asia ja erikseen
# ladattuina toinen jäisi huomaamatta. Kumpikaan ei tarvitse Pythonia,
# Hindenburgia eikä tätä repositoriota.
#
# Tagi `viewer-v*` julkaisee. Sama muoto kuin `build-podcast-magic.yml`illa
# — kaksi paketoitavaa sovellusta samassa repossa ajautuu erilleen, jos ne
# julkaistaan eri tavalla.
on:
  workflow_dispatch:
  push:
    tags: ["viewer-v*"]

permissions:
  contents: read

jobs:
  app:
    # Apple Silicon -ajuri: laajennus on Swiftiä ja kääntyy ajurin arkkitehtuurille.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # Versio tagista eikä `project.yml`istä. Kolmas paikka, jossa numeroa
      # pidetään, on kolmas paikka joka jää jälkeen — ja macOS päättää
      # päivitystarpeen `CFBundleVersion`istä, joten vanhentunut numero
      # epäonnistuu tekemällä ei mitään.
      - name: Generate project at the tag's version
        working-directory: viewer
        run: |
          version="${GITHUB_REF_NAME#viewer-v}"
          [ "$version" = "$GITHUB_REF_NAME" ] && version="0.0.0-dev"
          echo "Versio: $version"
          sed -i '' "s/MARKETING_VERSION: \".*\"/MARKETING_VERSION: \"$version\"/" project.yml
          sed -i '' "s/CURRENT_PROJECT_VERSION: \".*\"/CURRENT_PROJECT_VERSION: \"$version\"/" project.yml
          xcodegen generate --spec project.yml
          echo "VIEWER_VERSION=$version" >> "$GITHUB_ENV"

          # XcodeGenin `info:`-avain **kirjoittaa** plistin, ei viittaa
          # siihen. Kumpikin tiedosto korvautui joka generoinnilla, ja
          # ainoa näkyvä oire oli versionumero — puuttuva `NSExtension` ei
          # kaada mitään, esikatselu vain ei ilmesty koskaan. Väitetään siis
          # se mitä ei voi nähdä: lähteet ovat generoinnin jälkeen ennallaan.
          git diff --exit-code App/Info.plist Extension/Info.plist || {
            echo "xcodegen kirjoitti Info.plistin päälle — paketoitava plist"
            echo "ei ole se joka on repositoriossa."
            exit 1
          }

      # Yhdenmukaisuustesti myös täällä. Julkaisu, joka ei ole samaa mieltä
      # `nhsx-render`in kanssa, näyttäisi eri jakson kuin se renderöi.
      - name: NhsxKit agrees with the recorded plan
        working-directory: viewer
        run: swift test

      - name: Build
        working-directory: viewer
        run: |
          xcodebuild -project NhsxViewer.xcodeproj \
            -scheme NhsxViewerApp -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES \
            build

      # Mitä pakettiin oikeasti päätyi. Laajennus on paketti sovelluksen
      # sisällä, ja jos se puuttuu, sovellus käynnistyy normaalisti eikä
      # esikatselu vain koskaan ilmesty — vika joka ei näy mitenkään muuten.
      - name: The extension really is inside the app
        working-directory: viewer
        run: |
          app="build/Build/Products/Release/NHSX Viewer.app"
          ls -la "$app/Contents/PlugIns/"
          test -d "$app/Contents/PlugIns/NhsxQuickLook.appex" \
            || { echo "Laajennus puuttuu paketista."; exit 1; }
          codesign --verify --deep --strict "$app"
          codesign -d --entitlements - "$app/Contents/PlugIns/NhsxQuickLook.appex" \
            | tee /tmp/ent.txt
          grep -q "app-sandbox" /tmp/ent.txt \
            || { echo "Laajennukselta puuttuu hiekkalaatikko — se ei rekisteröidy."; exit 1; }

          # `get-task-allow` päästää virheenjäljittimen kiinni sovellukseen ja
          # on Applen notarisoinnissa suora hylkäys. Xcode lisää sen itse kun
          # allekirjoitus on «Sign to Run Locally», joten sen poissaolo on
          # väitettävä — se palaisi hiljaa yhdestä asetusmuutoksesta.
          for part in "$app" "$app/Contents/PlugIns/NhsxQuickLook.appex"; do
            if codesign -d --entitlements - "$part" 2>/dev/null | grep -q "get-task-allow"; then
              echo "$part kantaa get-task-allow'ta — sitä ei jaeta."
              exit 1
            fi
          done
          echo "Ei get-task-allow'ta kummassakaan."

          # Äänipoolin lukuoikeus. Ilman tätä esikatselu piirtää istunnon
          # oikein ja on hiljaa — ei virhettä, ei kaatumista, ei mitään
          # muuta jälkeä kuin rivi «ei auennut». Oikeus voi kadota yhdestä
          # siivouksesta, ja vika palaisi juuri sellaisena.
          for part in "$app" "$app/Contents/PlugIns/NhsxQuickLook.appex"; do
            ent=$(codesign -d --entitlements - "$part" 2>/dev/null)
            for want in "temporary-exception.files.absolute-path.read-only" "/Users/" "/Volumes/"; do
              case "$ent" in
                *"$want"*) ;;
                *) echo "$part: oikeuksista puuttuu «$want» — äänipooli ei aukea."; exit 1 ;;
              esac
            done
            echo "  $part lukee äänipoolin."
          done

          # Mitä pakettiin **oikeasti** kirjoitettiin. Käännösasetus voi olla
          # oikein ja paketissa silti lukea 1.0, jos plistissä ei ole avainta
          # johon se sijoitetaan — niin kävi julkaisussa viewer-v2026.8.28.1.
          # macOS päättää päivitystarjouksen `CFBundleVersion`ista, joten
          # jumiin jäänyt numero epäonnistuu tekemällä ei mitään.
          for part in "$app" "$app/Contents/PlugIns/NhsxQuickLook.appex"; do
            plist="$part/Contents/Info.plist"
            short=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$plist")
            build=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$plist")
            echo "$part → $short ($build)"
            if [ "$short" != "$VIEWER_VERSION" ] || [ "$build" != "$VIEWER_VERSION" ]; then
              echo "Odotettiin $VIEWER_VERSION, paketissa on $short ($build)."
              exit 1
            fi
          done

      # Mitä paketti **ilmoittaa** olevansa. Laajennus ilman `NSExtension`ia
      # kääntyy, allekirjoittuu ja asentuu; se ei vain koskaan rekisteröidy
      # esikatseluksi, eikä mikään kerro miksi. Sama koskee `.nhsx`:n
      # tyyppitunnistetta: ilman sitä välilyönti Finderissä ei tee mitään.
      - name: The bundles declare what they are for
        working-directory: viewer
        run: |
          app="build/Build/Products/Release/NHSX Viewer.app"
          ext="$app/Contents/PlugIns/NhsxQuickLook.appex/Contents/Info.plist"
          plist="$app/Contents/Info.plist"

          want() {
            got=$(/usr/libexec/PlistBuddy -c "Print $2" "$1" 2>&1) || true
            echo "  $2 → $got"
            if [ "$got" != "$3" ]; then
              printf 'Odotettiin: %s\nPaketissa:  %s\n' "$3" "$got"
              exit 1
            fi
          }

          echo "$ext"
          want "$ext" ":NSExtension:NSExtensionPointIdentifier" \
               "com.apple.quicklook.preview"
          want "$ext" ":NSExtension:NSExtensionPrincipalClass" \
               "NhsxQuickLook.PreviewViewController"
          want "$ext" ":NSExtension:NSExtensionAttributes:QLSupportedContentTypes:0" \
               "com.hindenburg.nhsx"

          echo "$plist"
          want "$plist" ":UTImportedTypeDeclarations:0:UTTypeIdentifier" \
               "com.hindenburg.nhsx"
          want "$plist" ":CFBundleDocumentTypes:0:LSItemContentTypes:0" \
               "com.hindenburg.nhsx"

          # `CFBundleExecutable` tuli ennen XcodeGeniltä. Nyt se tulee
          # plististä, ja väärä nimi näkyy vasta käyttäjän koneella
          # ilmoituksena ettei sovellusta voi avata.
          for part in "$app" "$app/Contents/PlugIns/NhsxQuickLook.appex"; do
            exe=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" \
                  "$part/Contents/Info.plist")
            echo "  $part → MacOS/$exe"
            test -x "$part/Contents/MacOS/$exe" \
              || { echo "Paketti nimeää käynnistettävän jota ei ole."; exit 1; }
          done

      - name: Disk image
        working-directory: viewer
        run: |
          mkdir -p dist staging
          # `ditto` eikä `cp`: allekirjoitus kattaa laajennetut attribuutit ja
          # symlinkit, ja tavallinen kopio rikkoo sen niin että Gatekeeper
          # hylkää paketin vasta toisen käyttäjän koneella.
          ditto "build/Build/Products/Release/NHSX Viewer.app" \
                "staging/NHSX Viewer.app"
          ln -s /Applications staging/Applications
          hdiutil create -volname "NHSX Viewer" -srcfolder staging \
            -ov -format UDZO "dist/NHSX-Viewer.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: viewer-app
          path: viewer/dist/*.dmg
          if-no-files-found: error

  cli:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/podcast-magic
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Naulattu staattinen ffmpeg tarkistussummineen. Ilman sitä binääri
      # kaatuisi ensimmäiseen renderöintiin koneella jolla ei ole ffmpegiä —
      # eli sillä koneella jota varten se tehtiin.
      - name: Fetch the ffmpeg that goes inside
        run: uv run python scripts/fetch_binaries.py

      - name: Build nhsx-render
        run: |
          uv run --with pyinstaller pyinstaller --clean --noconfirm nhsx-render.spec

      # Binääri, joka kääntyi mutta ei aja, on binääri jota ei ole testattu.
      # Ajetaan se oikeaa istuntoa vasten ja luetaan tulos.
      - name: It runs, and it agrees with the recorded plan
        run: |
          binary="dist/nhsx-render"
          test -x "$binary"
          work=$(mktemp -d)
          cp ../../viewer/Conformance/session.nhsx "$work/"
          : > "$work/olli.wav"; : > "$work/panu.wav"; : > "$work/musiikki.wav"
          "$binary" "$work/session.nhsx" --conformance > "$work/got.json"
          python3 - "$work/got.json" ../../viewer/Conformance/plan.json <<'PY'
          import json, sys
          got, want = (json.load(open(p)) for p in sys.argv[1:3])
          assert got == want, "paketoitu binääri ei ole samaa mieltä kirjatun vastauksen kanssa"
          print("Paketoitu binääri tuottaa saman suunnitelman.")
          PY

      # ffmpeg on mukana vain jos se on mukana. Renderöidään oikeaa ääntä.
      - name: The bundled ffmpeg is really bundled
        run: |
          work=$(mktemp -d)
          python3 - "$work" <<'PY'
          import math, struct, sys, wave
          from pathlib import Path
          d = Path(sys.argv[1]); sr = 8000
          for name in ("a.wav",):
              with wave.open(str(d / name), "wb") as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
                  w.writeframes(b"".join(
                      struct.pack("<h", int(16000 * math.sin(2 * math.pi * 440 * t / sr)))
                      for t in range(sr * 2)))
          (d / "s.nhsx").write_text(
              '<?xml version="1.0"?><Session Name="t">'
              '<AudioPool Path=""><File Id="1" Name="a.wav" Path="a.wav"/></AudioPool>'
              '<Tracks><Track Name="A"><Region Ref="1" Start="0" Length="2" Offset="0"/>'
              '</Track></Tracks></Session>', encoding="utf-8")
          PY
          # PATHista ffmpeg pois, jotta paketoitu on ainoa mahdollinen.
          env PATH=/usr/bin:/bin dist/nhsx-render "$work/s.nhsx" -o "$work/out.wav"
          python3 - "$work/out.wav" <<'PY'
          import sys, wave
          with wave.open(sys.argv[1]) as w:
              assert w.getnframes() > 0, "renderöity tiedosto on tyhjä"
              print(f"Renderöity {w.getnframes()} kehystä, {w.getsampwidth()*8}-bittistä.")
          PY

      - name: Package
        run: |
          cd dist && tar czf "nhsx-render-macos-$(uname -m).tar.gz" nhsx-render

      - uses: actions/upload-artifact@v4
        with:
          name: nhsx-render-cli
          path: apps/podcast-magic/dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/viewer-v')
    needs: [app, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Kaksi työkalua, joilla `.nhsx`-istunnon saa auki ilman Hindenburgia.

          **NHSX Viewer.app** — vedä Ohjelmat-kansioon ja **avaa kerran**.
          Sen jälkeen Finderissä välilyönti `.nhsx`-tiedoston päällä näyttää
          raidat ja alueet ja soittaa miksauksen. Avaaminen kerran on se, mikä
          rekisteröi esikatselun; ilman sitä mitään ei tapahdu.

          **nhsx-render** — komentorivityökalu, joka kirjoittaa istunnosta
          WAVin. ffmpeg on mukana, joten mitään ei tarvitse asentaa:

              tar xzf nhsx-render-macos-*.tar.gz
              xattr -d com.apple.quarantine nhsx-render
              ./nhsx-render "jakso 8.nhsx"            # → jakso 8.wav
              ./nhsx-render "jakso 8.nhsx" --plan     # mitä kuuluisi

          ### Ensimmäinen avaus

          Kumpikaan ei ole Applen notarisoima, koska siihen tarvitaan
          Developer ID. Sovellus: oikea klikkaus ja «Avaa», tai
          Järjestelmäasetukset → Tietosuoja ja turvallisuus → «Avaa silti».
          Komentorivityökalu: `xattr -d com.apple.quarantine nhsx-render`.

          Jos esikatselu ei ilmesty avaamisen jälkeen, `qlmanage -r`
          pakottaa Quick Lookin lukemaan laajennukset uudestaan.

          ---

          Neither is notarised by Apple — that needs a Developer ID. For the
          app: right-click and choose "Open", or System Settings → Privacy &
          Security → "Open Anyway". For the CLI:
          `xattr -d com.apple.quarantine nhsx-render`. Open the app **once**
          to register the preview; `qlmanage -r` if it does not appear.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md
