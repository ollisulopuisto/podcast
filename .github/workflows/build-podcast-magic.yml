name: build podcast-magic

# Sama muoto kuin `build-autoraffkat.yml`illa, ja tarkoituksella: kaksi
# paketoitavaa sovellusta samassa repositoriossa julkaistaan samalla tavalla,
# tai toinen niistä alkaa ajautua. Paketointi ajetaan tageista ja käsin, ei
# jokaisesta puskusta: käännös hakee ffmpegin verkosta ja kestää minuutteja,
# kun taas testit ovat sekunteja.
#
# Tagi `podcast-magic-v*` julkaisee paketit GitHubin Releaseen. Nimetty
# sovelluksen mukaan, koska monorepossa kolme sovellusta jakaa saman
# tagiavaruuden ja pelkkä `v*` osuisi mihin tahansa.
on:
  workflow_dispatch:
  push:
    tags: ["podcast-magic-v*"]

permissions:
  contents: read

jobs:
  build:
    # Kolme alustaa. macOS on koti — `.nhsx` on Hindenburgin istuntoformaatti
    # ja nopein moottori (mlx) ajaa Applen näytönohjaimella — mutta Hindenburg
    # on myös Windowsilla, ja `faster-whisper` ajaa suorittimella kaikkialla.
    # Windows- ja Linux-paketit ovat siis hitaampia, eivät vajaita.
    #
    # `fail-fast: false`, koska yhden alustan kaatuminen ei tee muista
    # käyttökelvottomia — ja koska kolmesta ajosta oppii kerralla enemmän.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/podcast-magic
        # Bash myös Windowsilla: yksi skriptikieli kolmelle alustalle, tai
        # samasta askeleesta on kaksi versiota joista toinen vanhenee.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Testien ffmpeg tulee järjestelmästä: kehityksessä binääri haetaan
      # PATHista, ja vasta pakattu ohjelma käyttää niputettua.
      - name: Install ffmpeg (macOS)
        if: matrix.platform == 'macos'
        run: brew install ffmpeg
      - name: Install ffmpeg (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (Windows)
        if: matrix.platform == 'windows'
        run: choco install ffmpeg -y --no-progress

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Työtila, ei yksi jäsen: jaettu työkalusto (pytest, ruff) on juuren
      # `dependency-groups`issa, ja `uv sync` jäsenen hakemistossa jättää sen
      # asentamatta sekä poistaa muiden jäsenten riippuvuudet samasta
      # ympäristöstä. Ensimmäinen ajo kaatui tähän: «Failed to spawn: pytest».
      #
      # mlx on Apple Siliconin Metal-moottori eikä asennu muualle, joten
      # `--all-extras` on macOS:n asia. Muualla moottori on `faster-whisper`,
      # ja ilman sitä syntyisi paketti jonka käyttöliittymä toimii mutta
      # litterointi kertoo puuttuvasta moottorista.
      - name: Install (macOS)
        if: matrix.platform == 'macos'
        run: uv sync --all-packages --all-extras --directory ../..
      - name: Install (Windows, Linux)
        if: matrix.platform != 'macos'
        run: uv sync --all-packages --directory ../..
      - name: Engine for Windows and Linux
        if: matrix.platform != 'macos'
        run: uv pip install faster-whisper

      # Testit ennen pakkausta. Rikkinäinen binääri on pahempi kuin hidas
      # käännös: sen ehtii ladata ennen kuin kukaan huomaa.
      - name: Tests
        run: uv run pytest -q

      # Niputettavat ffmpeg-binäärit ovat iso lataus ulkopuoliselta
      # palvelimelta. Välimuisti pitää käännöksen pystyssä silloinkin kun se
      # palvelin on nurin.
      - name: Cache bundled ffmpeg
        uses: actions/cache@v4
        with:
          path: apps/podcast-magic/bin
          key: ffmpeg-${{ matrix.platform }}-${{ runner.arch }}-${{ hashFiles('apps/podcast-magic/scripts/fetch_binaries.py') }}

      # Versio ympäristöstä, jotta paketti kantaa saman numeron kuin
      # `pyproject.toml`. `.spec`in oletus on sama luku, ja
      # `tests/test_workspace_agrees.py` vahtii ettei se jää jälkeen.
      - name: Build
        env:
          PM_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -n "$PM_VERSION" ]; then
            export PM_VERSION="${PM_VERSION#podcast-magic-v}"
          else
            unset PM_VERSION
          fi
          if [ "${{ matrix.platform }}" = "macos" ]; then
            uv run python scripts/build_app.py --dmg
          else
            uv run python scripts/build_app.py
          fi

      # Mitä pakettiin oikeasti päätyi. Niputettu ffmpeg tulee ulkopuolelta ja
      # allekirjoitus voi rikkoutua kopioinnissa; kumpikin selviäisi ilman tätä
      # vasta käyttäjän koneelta. Arkkitehtuurien pitää täsmätä.
      - name: Report what is inside (macOS)
        if: matrix.platform == 'macos'
        run: |
          echo "sovellus: $(file -b "dist/Podcast Magic.app/Contents/MacOS/podcast-magic")"
          echo "ffmpeg:   $(file -b bin/ffmpeg)"
          codesign --verify --deep --strict "dist/Podcast Magic.app"
          echo "allekirjoitus kelpaa"

      # Alusta ja arkkitehtuuri nimeen: Releaseen tulee kolme pakettia, ja
      # väli nimessä ei kestä latauslinkkiä.
      - name: Name the package
        id: name
        run: |
          arch=$(uname -m)
          name="podcast-magic-${{ matrix.platform }}-${arch}"
          case "${{ matrix.platform }}" in
            macos)
              mv "dist/Podcast Magic.dmg" "dist/${name}.dmg"
              ;;
            windows)
              # PyInstallerin COLLECT jättää hakemiston, ei yhtä tiedostoa.
              (cd dist && 7z a -tzip "${name}.zip" podcast-magic >/dev/null)
              ;;
            linux)
              (cd dist && tar czf "${name}.tar.gz" podcast-magic)
              ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: podcast-magic-${{ matrix.platform }}
          path: |
            apps/podcast-magic/dist/podcast-magic-*.dmg
            apps/podcast-magic/dist/podcast-magic-*.zip
            apps/podcast-magic/dist/podcast-magic-*.tar.gz
          if-no-files-found: error

  release:
    # Vain tagista. Käsin ajettu käännös jää artefaktiksi, ei julkaisuksi.
    if: startsWith(github.ref, 'refs/tags/podcast-magic-v')
    needs: [build]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/podcast-magic
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apps/podcast-magic/dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ### macOS
          Levykuva ei ole Applen notarisoima, koska siihen tarvitaan Developer
          ID. Ensimmäisellä avauksella: oikea klikkaus paketin päällä ja
          «Avaa», tai `xattr -d com.apple.quarantine "Podcast Magic.app"`.

          The disk image is not notarised by Apple — that needs a Developer ID.
          On first launch: right-click the app and choose "Open", or run
          `xattr -d com.apple.quarantine "Podcast Magic.app"`.

          ### Windows & Linux
          Moottori on `faster-whisper` ja se ajaa suorittimella: sama tulos
          kuin Macilla, moninkertainen aika. Metal-kiihdytys (mlx) on Apple
          Siliconin asia. Linuxilla käyttöliittymä avautuu selaimeen, koska
          natiivi ikkuna tarvitsisi GTK:n ja WebKit2:n koneelta.

          The engine on these is `faster-whisper`, running on the CPU: same
          result as on a Mac, several times the time. Metal acceleration (mlx)
          is Apple Silicon only. On Linux the interface opens in a browser —
          a native window would need GTK and WebKit2 from the machine.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/podcast-magic-* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes
