name: Check Colab Dependencies

on:
  schedule:
    # Ajastus: 1. päivä joka 3. kuukausi klo 06:00 UTC (maalis, kesä, syys, joulu)
    - cron: '0 6 1 */3 *'
  workflow_dispatch:

# Skripti lukee PyPI:tä ja kirjoittaa raportin ajon omaan työkansioon; arkistoon
# se ei kirjoita mitään.
permissions:
  contents: read

jobs:
  check-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Tarkista PyPI-versiot ja generoi raportti
        run: uv run python scripts/check_colab_deps.py
