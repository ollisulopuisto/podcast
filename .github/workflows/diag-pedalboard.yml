name: diag-pedalboard

# Throwaway: which pedalboard versions import on which runner CPUs
# (0.9.24 died with SIGILL on CPUs without AVX-512).
on:
  push:
    branches: ['diag/**']

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        version: ['0.9.24', '0.9.23', '0.9.22', '0.9.21', '0.9.20', '0.9.19', '0.9.16', 'latest']
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: astral-sh/setup-uv@v5
      - name: Probe
        run: |
          cpu="$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)"
          if grep -m1 flags /proc/cpuinfo | grep -q avx512f; then a=avx512; else a=avx2only; fi
          spec="pedalboard"; [ "${{ matrix.version }}" != "latest" ] && spec="pedalboard==${{ matrix.version }}"
          set +e
          out="$(uv run --python 3.13 --with "$spec" python -c "import pedalboard; print(pedalboard.__version__)" 2>&1)"; code=$?
          set -e
          echo "$out" | tail -2
          mkdir -p res
          echo "${{ matrix.version }} | $a | $cpu | code=$code | $(echo "$out" | tail -1 | cut -c1-60)" > "res/${{ matrix.version }}-${{ matrix.n }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: res-${{ matrix.version }}-${{ matrix.n }}
          path: res/

  report:
    needs: cpu
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: res-*
          merge-multiple: true
          path: res
      - name: Table
        run: |
          echo "=== version | avx | cpu | exit code | last line"
          cat res/*.txt | sort
          echo "=== summary: version avx exit count"
          cat res/*.txt | awk -F' [|] ' '{print $1, $2, $4}' | sort | uniq -c
