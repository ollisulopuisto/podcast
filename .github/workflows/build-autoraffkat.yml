name: Autoraffkat direct morning DMG
'on':
  workflow_dispatch:
    inputs:
      source_sha:
        description: Expected latest merged main SHA. App checkout is pinned to this SHA.
        required: true
        type: string
permissions:
  contents: write
env: {}
jobs:
  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/autoraffkat
    steps:
    - name: Resolve latest merged main
      env:
        GH_TOKEN: ${{ github.token }}
        EXPECTED_SHA: ${{ inputs.source_sha }}
      run: 'set -euo pipefail

        SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)

        [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]

        test "$EXPECTED_SHA" = "$SHA"

        echo "BUILD_SHA=$SHA" >> "$GITHUB_ENV"

        echo "App source: $SHA" >> "$GITHUB_STEP_SUMMARY"

        '
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.BUILD_SHA }}
    - name: Install ffmpeg
      run: brew install ffmpeg
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: false
        save-cache: false
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
    - name: Install
      run: uv sync --all-packages --all-extras --directory ../..
    - name: Tests
      if: ${{ github.event_name != 'workflow_dispatch' || !inputs.hotfix_artifact }}
      run: uv run pytest -q
    - name: Hotfix artifact bypass notice
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.hotfix_artifact }}
      run: 'echo "HOTFIX BUILD ONLY: tests were skipped; this run cannot publish a release."'
    - name: Import Developer ID certificate
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: 'set -euo pipefail

        test -n "$BUILD_CERTIFICATE_BASE64"

        test -n "$P12_PASSWORD"

        test -n "$KEYCHAIN_PASSWORD"

        KEYCHAIN_PATH="$RUNNER_TEMP/podcast-signing.keychain-db"

        CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"

        printf ''%s'' "$BUILD_CERTIFICATE_BASE64" | base64 -D -o "$CERTIFICATE_PATH"

        export KEYCHAIN_PATH="$KEYCHAIN_PATH" CERTIFICATE_PATH="$CERTIFICATE_PATH"

        export KEYCHAIN_PASSWORD="$KEYCHAIN_PASSWORD" P12_PASSWORD="$P12_PASSWORD"

        python3 "$GITHUB_WORKSPACE/scripts/macos_ci_credentials.py" import-certificate

        security list-keychains -d user -s "$KEYCHAIN_PATH"

        rm -f "$CERTIFICATE_PATH"

        security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F ''Developer ID Application: Olli Sulopuisto (LWSR8T5392)''

        '
    - name: Build app and disk image
      env:
        AR_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        APPLE_SIGNING_IDENTITY: 'Developer ID Application: Olli Sulopuisto (LWSR8T5392)'
      run: "if [ -n \"$AR_VERSION\" ]; then\n  export AR_VERSION=\"${AR_VERSION#autoraffkat-v}\"\nelse\n  unset AR_VERSION\n\
        fi\nuv run python scripts/build_app.py --dmg\n"
    - name: Report what is inside
      id: inside
      run: 'arch=$(uname -m)

        echo "arch=$arch" >> "$GITHUB_OUTPUT"

        echo "sovellus: $(file -b dist/autoraffkat.app/Contents/MacOS/autoraffkat)"

        echo "ffmpeg:   $(file -b bin/ffmpeg)"

        codesign --verify --deep --strict dist/autoraffkat.app

        echo "allekirjoitus kelpaa"

        '
    - name: Name the image by architecture
      run: mv dist/autoraffkat.dmg "dist/autoraffkat-${{ steps.inside.outputs.arch }}.dmg"
    - name: Sign and verify DMG
      env:
        APPLE_SIGNING_IDENTITY: 'Developer ID Application: Olli Sulopuisto (LWSR8T5392)'
      run: 'DMG_PATH="dist/autoraffkat-${{ steps.inside.outputs.arch }}.dmg"

        codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$DMG_PATH"

        codesign --verify --verbose=2 "$DMG_PATH"

        '
    - name: Notarise and staple DMG
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        APPLE_TEAM_ID: LWSR8T5392
      run: "set -euo pipefail\nDMG_PATH=\"dist/autoraffkat-${{ steps.inside.outputs.arch }}.dmg\"\nif [ -z \"$APPLE_ID\" ]\
        \ || [ -z \"$APPLE_APP_PASSWORD\" ]; then\n  if [ \"$GITHUB_REF_TYPE\" = tag ]; then\n    echo \"::error::APPLE_ID\
        \ / APPLE_APP_PASSWORD puuttuvat; julkaisun pit\xE4\xE4 olla notarisoitu.\"\n    exit 1\n  fi\n  echo \"::warning::Ei\
        \ notarisointitunnuksia: artefakti on allekirjoitettu mutta ei notarisoitu.\"\n  exit 0\nfi\nexport KEYCHAIN_PATH=\"\
        $RUNNER_TEMP/podcast-signing.keychain-db\"\nexport APPLE_TEAM_ID=\"${APPLE_TEAM_ID:-LWSR8T5392}\"\npython3 \"$GITHUB_WORKSPACE/scripts/macos_ci_credentials.py\"\
        \ store-notary-credentials\nresult=$(xcrun notarytool submit \"$DMG_PATH\" --keychain-profile ci-notary --keychain\
        \ \"$KEYCHAIN_PATH\" --wait --timeout 45m --output-format json) || true\necho \"$result\"\nid=$(printf '%s' \"$result\"\
        \ | python3 -c 'import json,sys; print(json.load(sys.stdin)[\"id\"])')\nstatus=$(printf '%s' \"$result\" | python3\
        \ -c 'import json,sys; print(json.load(sys.stdin)[\"status\"])')\nif [ \"$status\" != Accepted ]; then\n  xcrun notarytool\
        \ log \"$id\" --keychain-profile ci-notary --keychain \"$KEYCHAIN_PATH\"\n  exit 1\nfi\nxcrun stapler staple \"$DMG_PATH\"\
        \nxcrun stapler validate \"$DMG_PATH\"\nspctl --assess --type open --context context:primary-signature --verbose=2\
        \ \"$DMG_PATH\"\n"
    - name: Remove signing keychain
      if: always()
      run: security delete-keychain "$RUNNER_TEMP/podcast-signing.keychain-db" || true
    - name: Deliver verified versioned DMG directly to draft Release
      env:
        GH_TOKEN: ${{ github.token }}
      working-directory: ${{ github.workspace }}
      run: 'set -euo pipefail

        VERSION=$(python3 -c ''import tomllib; print(tomllib.load(open("apps/autoraffkat/pyproject.toml","rb"))["project"]["version"])'')

        [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)+$ ]]

        TAG="morning-${VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

        NAME="Autoraffkat-${VERSION}-manual.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}-macos-arm64.dmg"

        mkdir -p "$RUNNER_TEMP/morning-release"

        cp "apps/autoraffkat/dist/autoraffkat-arm64.dmg" "$RUNNER_TEMP/morning-release/$NAME"

        cd "$RUNNER_TEMP/morning-release"

        shasum -a 256 "$NAME" > SHA256.txt

        shasum -a 256 -c SHA256.txt

        cat > notes.md <<EOF

        Fresh Apple Silicon build from merged main $BUILD_SHA.

        App version: $VERSION. Build ID: $GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT.

        Developer ID signed, notarized and stapled by the existing packaging steps.

        Native feature/UI acceptance has not been performed. Draft test build, not a stable release.

        No Actions artifact/cache storage and no non-Mac builds.

        EOF

        gh release create "$TAG" "$NAME" SHA256.txt --target "$BUILD_SHA" --draft --prerelease --latest=false --title "Autoraffkat
        $VERSION arm64 TEST $GITHUB_RUN_ID" --notes-file notes.md

        '
    timeout-minutes: 90
    permissions:
      contents: write
