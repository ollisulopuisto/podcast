name: build autoraffkat

# Paketointi ajetaan tageista ja käsin, ei jokaisesta puskusta: käännös hakee
# ffmpegin verkosta ja kestää minuutteja, kun taas testit ovat sekunteja.
# Tagi `autoraffkat-v*` julkaisee levykuvan GitHubin Releaseen.
# Nimetty sovelluksen mukaan, koska monorepossa kolme sovellusta
# jakaa saman tagiavaruuden ja pelkkä `v*` osuisi mihin tahansa.
on:
  workflow_dispatch:
    inputs:
      hotfix_artifact:
        description: Build an artifact now without the test suites (no GitHub Release)
        type: boolean
        required: false
        default: false
  push:
    tags: ["autoraffkat-v*"]

permissions:
  contents: read

jobs:
  macos:
    # Vain Apple Silicon. GitHub on poistanut ilmaiset Intel-ajurit
    # (`macos-13`), ja jäljellä olevat x86_64-imaget ovat maksullisia isoja
    # ajureita. Intel-paketti tehdään siis toistaiseksi käsin Intel-koneella:
    # `uv run python scripts/build_app.py --dmg`. Arkkitehtuuri luetaan
    # ajurilta eikä kirjoiteta tähän, jottei tiedoston nimi voi valehdella.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/autoraffkat
    steps:
      - uses: actions/checkout@v7

      - name: Install ffmpeg
        run: brew install ffmpeg

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install
        # Työtila, ei yksi jäsen: jaettu työkalusto (pytest, ruff) on juuren
        # `dependency-groups`issa, ja `uv sync` jäsenen hakemistossa jättää sen
        # asentamatta sekä poistaa muiden jäsenten riippuvuudet samasta
        # ympäristöstä. Ensimmäinen ajo kaatui tähän: «Failed to spawn: pytest».
        run: uv sync --all-packages --all-extras --directory ../..

      # Testit ennen pakkausta. Rikkinäinen binääri on pahempi kuin hidas
      # käännös: sen ehtii ladata ennen kuin kukaan huomaa.
      - name: Tests
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.hotfix_artifact }}
        run: uv run pytest -q

      - name: Hotfix artifact bypass notice
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.hotfix_artifact }}
        run: >-
          echo "HOTFIX BUILD ONLY: tests were skipped; this run cannot publish a release."

      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BUILD_CERTIFICATE_BASE64"
          test -n "$P12_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          KEYCHAIN_PATH="$RUNNER_TEMP/podcast-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 -D -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F 'Developer ID Application: Olli Sulopuisto (LWSR8T5392)'

      # Niputettavat ffmpeg-binäärit ovat iso lataus ulkopuoliselta
      # palvelimelta. Välimuisti pitää käännöksen pystyssä silloinkin kun se
      # palvelin on nurin.
      - name: Cache bundled ffmpeg
        uses: actions/cache@v6
        with:
          path: apps/autoraffkat/bin
          key: ffmpeg-${{ runner.arch }}-${{ hashFiles('apps/autoraffkat/scripts/fetch_binaries.py') }}

      # Versio ympäristöstä, jotta paketti kantaa saman numeron kuin
      # `pyproject.toml`. `.spec`in oletus on sama luku, ja
      # `tests/test_workspace_agrees.py` vahtii ettei se jää jälkeen.
      - name: Build app and disk image
        env:
          AR_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Olli Sulopuisto (LWSR8T5392)"
        run: |
          if [ -n "$AR_VERSION" ]; then
            export AR_VERSION="${AR_VERSION#autoraffkat-v}"
          else
            unset AR_VERSION
          fi
          uv run python scripts/build_app.py --dmg

      # Mitä pakettiin oikeasti päätyi. Niputettu ffmpeg tulee ulkopuolelta ja
      # allekirjoitus voi rikkoutua kopioinnissa; kumpikin selviäisi ilman tätä
      # vasta käyttäjän koneelta. Arkkitehtuurien pitää täsmätä.
      - name: Report what is inside
        id: inside
        run: |
          arch=$(uname -m)
          echo "arch=$arch" >> "$GITHUB_OUTPUT"
          echo "sovellus: $(file -b dist/autoraffkat.app/Contents/MacOS/autoraffkat)"
          echo "ffmpeg:   $(file -b bin/ffmpeg)"
          codesign --verify --deep --strict dist/autoraffkat.app
          echo "allekirjoitus kelpaa"

      # Arkkitehtuuri nimeen, jotta Releaseen mahtuu myöhemmin toinenkin.
      - name: Name the image by architecture
        run: mv dist/autoraffkat.dmg "dist/autoraffkat-${{ steps.inside.outputs.arch }}.dmg"

      # Requires APPLE_API_KEY_BASE64 (base64-encoded App Store Connect .p8),
      # APPLE_API_KEY_ID and APPLE_API_ISSUER repository secrets.
      - name: Sign and verify DMG
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Olli Sulopuisto (LWSR8T5392)"
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          DMG_PATH="dist/autoraffkat-${{ steps.inside.outputs.arch }}.dmg"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$DMG_PATH"
          codesign --verify --verbose=2 "$DMG_PATH"

          test -n "$APPLE_API_KEY_BASE64"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          trap 'rm -f "$KEY_PATH"' EXIT
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D -o "$KEY_PATH"

          xcrun notarytool submit "$DMG_PATH" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

      - uses: actions/upload-artifact@v7
        with:
          name: autoraffkat-${{ steps.inside.outputs.arch }}
          path: apps/autoraffkat/dist/autoraffkat-*.dmg
          if-no-files-found: error

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/podcast-signing.keychain-db" || true

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/autoraffkat
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install
        # Työtila, ei yksi jäsen: jaettu työkalusto (pytest, ruff) on juuren
        # `dependency-groups`issa, ja `uv sync` jäsenen hakemistossa jättää sen
        # asentamatta sekä poistaa muiden jäsenten riippuvuudet samasta
        # ympäristöstä. Ensimmäinen ajo kaatui tähän: «Failed to spawn: pytest».
        run: uv sync --all-packages --all-extras --directory ../..

      - name: Cache bundled ffmpeg
        uses: actions/cache@v6
        with:
          path: apps/autoraffkat/bin
          key: ffmpeg-windows-${{ runner.arch }}-${{ hashFiles('apps/autoraffkat/scripts/fetch_binaries.py') }}

      - name: Fetch binaries
        run: uv run python scripts/fetch_binaries.py --os windows

      # macOSilla ffmpeg tulee brew'sta polkuun; Windowsissa se ladataan
      # `bin`-hakemistoon, josta testit eivät sitä löydä: aineiston synteesi
      # ajaa `ffmpeg`in suoraan polusta.
      - name: Put bundled ffmpeg on PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$env:GITHUB_WORKSPACE\apps\autoraffkat\bin"

      - name: Tests
        run: uv run pytest -q

      - name: Build Windows app
        run: uv run python scripts/build_app.py --clean

      - name: Report what is inside
        shell: pwsh
        run: |
          Get-ChildItem dist/autoraffkat
          if (!(Test-Path "dist/autoraffkat/autoraffkat.exe")) {
            Write-Error "autoraffkat.exe puuttuu dist-kansiosta"
            exit 1
          }

      - name: Compress to ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/autoraffkat -DestinationPath dist/autoraffkat-windows-x64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: autoraffkat-windows-x64
          path: apps/autoraffkat/dist/autoraffkat-windows-x64.zip
          if-no-files-found: error

  release:
    # Vain tagista. Käsin ajettu käännös jää artefaktiksi, ei julkaisuksi.
    if: startsWith(github.ref, 'refs/tags/autoraffkat-v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/autoraffkat
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: apps/autoraffkat/dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ### macOS
          Sovellus ja levykuva on allekirjoitettu Developer ID:llä. Levykuva
          on notarisoitu ja notarisaatiolippu on liitetty siihen.

          The app and disk image are Developer ID signed. The disk image is
          notarised and its notarisation ticket is stapled.

          ### Windows
          Pura zip-paketti ja käynnistä `autoraffkat.exe`.
          Extract the zip package and run `autoraffkat.exe`.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes
