[project]
name = "podcast-magic"
version = "2026.8.27.1"
description = "Hindenburg-jälkityöt macOS:llä: litterointi ja hiljaisten kohtien vaimennus"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Olli Sulopuisto" }]
keywords = ["hindenburg", "whisper", "mlx", "transcription", "podcast", "nhsx"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
]
dependencies = [
    "numpy>=1.26",
    "lxml>=5.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pywebview>=5.0",
]

[project.scripts]
podcast-magic = "podcastmagic.__main__:main"

[project.optional-dependencies]
# Apple Silicon: Metal-kiihdytetty Whisper. Ei asennu Intelille eikä Linuxille,
# joten se on erillinen lisä eikä perusriippuvuus — muuten `uv sync` kaatuisi
# CI-ajurilla ja Intel-Macilla ennen kuin ohjelma edes käynnistyy.
mlx = ["mlx-whisper>=0.4.0"]
# Kaikille alustoille sopiva varakone. Sama moottori kuin Colab-muistikirjassa.
faster = ["faster-whisper>=1.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/podcastmagic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.28.1",
    "pyinstaller>=6.0",
]
