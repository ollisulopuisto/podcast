# Workspace root for the podcast tooling.
#
# The pipeline changed ten times in one day, and every change was driven by a
# measurement that invalidated the previous behaviour.  With a separately
# versioned package, each of those is a release plus a bump in every consumer,
# and the consumers drift in between -- which is the problem this layout exists
# to solve.  One repository, one atomic change, one test run.
#
#   packages/speechmix   the chain, de-bleeding, envelope analysis, the
#                        programme ceiling, the duck/rider envelope
#                        computation, and the measurement tests
#   apps/automixer       session reader, render
#
# Room is left for the sibling apps (autoraffkat's FCPXML reader/writer and
# cutting decisions, and whatever the next session-based app turns out to be):
# they drop in as further members of `apps/`.
#
# Split speechmix into a real PyPI package when the pipeline stops moving, or
# when a fourth consumer appears outside these three.  Splitting later is
# cheap; un-splitting is not.

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
speechmix = { workspace = true }
automixer = { workspace = true }

[dependency-groups]
dev = ["pytest>=9.0.2", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["packages/speechmix/tests", "apps/automixer/tests"]
