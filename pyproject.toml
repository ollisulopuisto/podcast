# Työtila, ei paketti. Kolme sovellusta ja niiden yhteinen ketju yhdessä
# repossa, koska ketju muuttuu vielä viikoittain: erillisenä pakettina
# jokainen mittauksen korjaama vika olisi julkaisu ja kolme nostoa, ja
# kuluttajat ajautuisivat erilleen niiden välissä. Juuri se ajautuminen on
# se ongelma jota tämä ratkaisee — automixer oli jäljessä neljästä
# mitatusta korjauksesta ennen tätä.
#
# Irrotetaan omaksi paketiksi kun ketju lakkaa liikkumasta tai kun neljäs
# kuluttaja ilmestyy. Jakaminen myöhemmin on halpaa, yhdistäminen ei.
[tool.uv.workspace]
members = ["packages/*", "apps/*"]

# Lintti on työtilan oma työkalu, ei sovellusten. Se on täällä kahdesta
# syystä. Ensinnäkin `uv run ruff` etsii ohjelman PATHista jos sitä ei ole
# ympäristössä: kehityskoneella se löytyy, CI-ajurilla ei, ja lintti kaatui
# «Failed to spawn: ruff» ‑riviin joka ainoassa ajossa repositorion
# ensimmäisestä päivästä lähtien — sääntöjä ei ole kertaakaan tarkistettu.
# Toiseksi versio on osa sääntöjä: eri ruff näkee eri virheet, joten
# kiinnittämätön lintti on portti joka päästää läpi eri asioita eri koneilla.
[dependency-groups]
dev = ["ruff==0.15.8"]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "SIM", "RET", "ARG",
          "PIE", "PERF", "NPY", "RUF"]
ignore = [
    "E501",
    "B023",
    # Koodi ja kommentit ovat suomea ja käyttävät typografisia merkkejä
    # tarkoituksella.
    "RUF001", "RUF002", "RUF003",
    # `int(round(x))` ei ole turha kun x on numpy-liukuluku.
    "RUF046",
    # Suodattava sisäkkäinen silmukka on luettavampi kuin comprehension
    # koodissa jossa selitys on rivien välissä.
    "PERF401",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["ARG", "B011", "SIM", "RUF012", "B905"]
