[project]
name = "framescore"
version = "2026.10.21.1"
description = "Picks the expressive frames of a video: scoring and ranking, no platform code"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Olli Sulopuisto" }]
keywords = ["thumbnail", "frame", "face", "video"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/framescore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
