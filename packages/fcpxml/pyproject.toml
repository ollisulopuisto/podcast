# Final Cut Pro XML (FCPXML) reader. Standard library only.
#
# Pelkkä standardikirjasto, ja `test_the_library_imports_nothing_but_the_
# standard_library` vartioi sitä: lukijan on voitava asentua sekä
# autoraffkatiin että kuulakseen ilman kumpaakaan sovellusta.

[project]
name = "fcpxml"
version = "2026.10.24.1"
description = "Final Cut Pro XML reader: exact rational times, neutral types (stdlib only)"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Olli Sulopuisto" }]
keywords = ["final-cut-pro", "fcpxml", "xml", "timeline", "podcast"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fcpxml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
