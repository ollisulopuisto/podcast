[project]
name = "speechmix"
version = "2026.8.27.1"
description = "Speech-mixing pipeline: samples in, samples out, no session format"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pedalboard>=0.9.22",
    "pyloudnorm>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speechmix"]
