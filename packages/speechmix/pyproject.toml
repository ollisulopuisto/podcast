[project]
name = "speechmix"
version = "0.1.0"
description = "The shared speech-mixing pipeline: samples in, samples out."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pyloudnorm>=0.2.0",
    "scipy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speechmix"]
