[project]
name = "speechmix"
version = "2026.10.8.6"
description = "Speech-mixing pipeline: samples in, samples out, no session format"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.2",
    "scipy>=1.17.1",
    "pedalboard>=0.9.24",
    "pyloudnorm>=0.2.0",
    "numba>=0.67.0",
    "psutil>=7.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speechmix"]

# Sama lohko kuin kolmella sovelluksella. `testpaths` ei ole muotoseikka:
# ilman sitä pytest kerää koko hakemiston, ja se kaatui kokoamiseen niin
# kauan kuin paketissa oli `reference/`-puu jota mikään ei tuonut sisään.
# Puu on poistettu, mutta rajaus jää — kaksi porttia ei saa nähdä eri puuta.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
